[project]
name = "harpa"
version = "0.1.0"
description = "Hub de Alocação e Recomendação de Portfólios de Ações"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
harpa-export-tickers = "harpa.bolsai.tickers:main"
harpa-export-fundamentals = "harpa.bolsai.fundamentals:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harpa"]
